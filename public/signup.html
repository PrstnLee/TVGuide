
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign Up | TV Guide</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
<main class="auth-card">
    <a class="auth-brand" href="/public">TV Guide</a>

    <h1>Create your account</h1>
    <p>Join the TV Guide community.</p>

    <form id="signup-form">
        <label for="username">Username</label>
        <input
                id="username"
                name="username"
                type="text"
                autocomplete="username"
                minlength="3"
                maxlength="50"
                pattern="[A-Za-z0-9_]{3,50}"
                title="Use 3–50 letters, numbers, or underscores."
                required
        >

        <label for="password">Password</label>
        <div class="password-wrapper">
            <input
                    id="password"
                    name="password"
                    type="password"
                    autocomplete="new-password"
                    minlength="8"
                    required
            >
            <button
                    type="button"
                    class="password-toggle"
                    data-password-toggle="password"
                    aria-label="Show password"
                    aria-pressed="false"
            >Show</button>
        </div>

        <label for="confirm-password">Confirm password</label>
        <div class="password-wrapper">
            <input
                    id="confirm-password"
                    name="confirm-password"
                    type="password"
                    autocomplete="new-password"
                    minlength="8"
                    required
            >
            <button
                    type="button"
                    class="password-toggle"
                    data-password-toggle="confirm-password"
                    aria-label="Show confirm password"
                    aria-pressed="false"
            >Show</button>
        </div>

        <button class="auth-primary" type="submit">Sign Up</button>
        <p id="auth-message" role="status" aria-live="polite"></p>
    </form>

    <p class="auth-footer">
        Already have an account? <a href="login.html">Log in</a>
    </p>
    <a class="back-link" href="index.html">Back to TV Guide</a>
</main>

<script src="auth.js"></script>
</body>
</html>
